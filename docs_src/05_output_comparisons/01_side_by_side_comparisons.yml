- id: topic_12_host_node_generation
  title: Automatic Lapis @[Tool] Host Node Synthesis (generate_node)
  summary: Synthesizing complete Crystal Godot 4 nodes (CompositorEffect, MeshInstance3D,
    CanvasLayer, ComputeParticles) directly from .crshader uniforms.
  content: 'Adding `generate_node` inside a `.crshader` file (or running `crshader
    generate-node scanline.crshader -t compositor`) bridges GPU shaders and CPU gameplay
    code with zero manual glue:

    - Harvests uniform types, defaults, `# doc comments`, `range:` sliders, `enum`
    hints, and `ColorPalette` arrays into typed Lapis `@[Export]` properties.

    - For `:compositor`, embeds the compiled `#version 450` GLSL string directly into
    the Crystal class, implements `_render_callback`, binds `RenderSceneBuffersRD`
    layers across stereo/mono views, and packs scalar/vector properties at exact `GLSLLayoutPacker`
    byte offsets!'
  comparisons:
  - title: 12A. Single `.crshader` -> Vulkan Compositor `.glsl` + Complete Lapis `@[Tool]`
      Host Class (`.cr`)
    description: Notice how `@intensity` (offset `0`) and `@line_count` (offset `4`)
      in `apply_parameters` match `CrShaderParams` (`std430`) byte-for-byte.
    columns:
    - label: CRShader Source (scanline.crshader)
      code: "generate_node :compositor, \"ScanlineEffect\", \"src/scanline_effect.cr\"\n\ncompositor_effect
        :post_transparent do\n  access :color\n  # Scanline darkness\n  property intensity
        : Float32 = 0.25, range: 0.0..1.0, step: 0.05\n  property line_count : Float32
        = 240.0, range: 60.0..720.0\n\n  process_pixel do |coord, uv, color|\n    wave
        = sin(uv.y * line_count * 6.28318) * 0.5 + 0.5\n    vec4(color.rgb * (1.0
        - wave * intensity), color.a)\n  end\nend"
      lang: crshader
      badge: SOURCE
    - label: Compiled Vulkan Pass (.glsl)
      code: "#version 450\n\nlayout(local_size_x = 8, local_size_y = 8, local_size_z
        = 1) in;\n\nlayout(rgba16f, set = 0, binding = 0) uniform image2D color_image;\n\nlayout(push_constant,
        std430) uniform CrShaderParams {\n\tfloat intensity;\n\tfloat line_count;\n};\n\nvoid
        main() {\n\tivec2 coord = ivec2(gl_GlobalInvocationID.xy);\n\tivec2 size =
        imageSize(color_image);\n\tif (((coord.x >= size.x) || (coord.y >= size.y)))
        {\n\t\treturn;\n\t}\n\tvec2 uv = ((vec2(float(coord.x), float(coord.y)) +
        vec2(0.5, 0.5)) / vec2(float(size.x), float(size.y)));\n\tvec4 color = imageLoad(color_image,
        coord);\n\tfloat wave = ((sin(((uv.y * line_count) * 6.28318)) * 0.5) + 0.5);\n\tvec4((color.rgb
        * (1.0 - (wave * intensity))), color.a);\n\timageStore(color_image, coord,
        color);\n}"
      lang: glsl
      badge: GLSL 450
    - label: Generated Lapis Host (scanline_effect.cr)
      code: "# =============================================================================\n#
        Auto-Generated Godot Node: ScanlineEffect < CompositorEffect\n# Synthesized
        directly from CRShader DSL by CrShader::NodeGenerator\n# =============================================================================\nrequire
        \"lapis\"\n\nmodule CrShader\n  include Godot\n\n  @[Tool]\n  node ScanlineEffect
        < CompositorEffect do\n    # Scanline darkness\n    @[Export(range: 0.0_f32..1.0_f32,
        step: 0.05_f32)]\n    property intensity : Float32 = 0.25_f32\n\n    @[Export(range:
        60.0_f32..720.0_f32)]\n    property line_count : Float32 = 240.0_f32\n\n    EMBEDDED_GLSL
        = \"#version 450\\n\\nlayout(local_size_x = 8, local_size_y = 8, local_size_z
        = 1) in;\\n\\nlayout(rgba16f, set = 0, binding = 0) uniform image2D color_image;\\n\\nlayout(push_constant,
        std430) uniform CrShaderParams {\\n\\tfloat intensity;\\n\\tfloat line_count;\\n};\\n\\nvoid
        main() {\\n\\tivec2 coord = ivec2(gl_GlobalInvocationID.xy);\\n\\tivec2 size
        = imageSize(color_image);\\n\\tif (((coord.x >= size.x) || (coord.y >= size.y)))
        {\\n\\t\\treturn;\\n\\t}\\n\\tvec2 uv = ((vec2(float(coord.x), float(coord.y))
        + vec2(0.5, 0.5)) / vec2(float(size.x), float(size.y)));\\n\\tvec4 color =
        imageLoad(color_image, coord);\\n\\tfloat wave = ((sin(((uv.y * line_count)
        * 6.28318)) * 0.5) + 0.5);\\n\\tvec4((color.rgb * (1.0 - (wave * intensity))),
        color.a);\\n\\timageStore(color_image, coord, color);\\n}\\n\\n\"\n\n    @compute_helper
        : ComputeHelper? = nil\n    @params_ubo_rid : Int64 = 0_i64\n\n    def initialize(pointer
        : Void* = Pointer(Void).null)\n      super(pointer)\n      configure_compositor
        unless @pointer.null?\n    end\n\n    def configure_compositor : Void\n      call(\"set_access_resolved_color\",
        true)\n      call(\"set_access_resolved_depth\", false)\n      call(\"set_effect_callback_type\",
        4)\n    end\n\n    def self._godot_has_virtual_method(method_name : String)
        : Bool\n      norm = method_name.starts_with?('_') ? method_name : \"_#{method_name}\"\n
        \     return true if norm == \"_render_callback\"\n      super\n    end\n\n
        \   def _godot_call_virtual_with_data(method_name : String, args : Void**,
        ret : Void*) : Void\n      norm = method_name.starts_with?('_') ? method_name
        : \"_#{method_name}\"\n      if norm == \"_render_callback\" && !args.null?
        && !args[0].null? && !args[1].null?\n        cb_type = args[0].as(Int64*).value\n
        \       rd_ptr = args[1].as(Void**).value\n        _render_callback(cb_type,
        Godot::RenderData.new(rd_ptr)) unless rd_ptr.null?\n        return\n      end\n
        \     super\n    end\n\n    def _render_callback(effect_callback_type : Int64,
        render_data : Godot::RenderData) : Void\n      return if render_data.pointer.null?
        || EMBEDDED_GLSL.empty?\n      helper = @compute_helper || (@compute_helper
        = ComputeHelper.new)\n      if helper.pipeline_rid <= 0\n        helper.compile_glsl(EMBEDDED_GLSL)\n
        \     end\n      return if helper.pipeline_rid <= 0\n\n      buffers_base
        = render_data.get_render_scene_buffers\n      return if buffers_base.pointer.null?\n
        \     buffers = Godot::RenderSceneBuffersRD.new(buffers_base.pointer)\n      size
        = buffers.get_internal_size\n      return if size.x <= 0 || size.y <= 0\n\n
        \     apply_parameters(helper)\n      views = Math.max(buffers.get_view_count,
        1_i64)\n      views.times do |view|\n        color_tex = buffers.get_color_layer(view)\n
        \       next if color_tex <= 0\n        helper.bind_image(0, color_tex, set_index:
        0)\n        helper.dispatch(size.x.to_i32, size.y.to_i32, 1, 8, 8, 1)\n      end\n
        \   end\n\n    def apply_parameters(helper : ComputeHelper) : Void\n      buf
        = Bytes.new(16, 0_u8)\n      base_ptr = buf.to_unsafe\n      (base_ptr + 0).as(Float32*).value
        = @intensity.to_f32\n      (base_ptr + 4).as(Float32*).value = @line_count.to_f32\n
        \     helper.set_push_constant(buf)\n    end\n  end\nend"
      lang: crystal
      badge: LAPIS NODE
    notes:
    - '`NodeGenerator` supports 5 host targets: `:mesh3d` (`MeshInstance3D`), `:canvas2d`
      (`CanvasLayer`), `:compositor` (`CompositorEffect`), `:particles` (`Node3D`
      compute dispatcher), and `:host` (`Node`).'
