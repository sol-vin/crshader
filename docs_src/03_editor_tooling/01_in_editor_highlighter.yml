id: A_IN_EDITOR_HIGHLIGHTER
title: "CRShader & Target Syntax Highlighting"
summary: "How CRShader tokenizes .crshader DSL and compiled .gdshader/.glsl targets with high-contrast dark-theme palettes."
track: "03_editor_tooling"
root_module: "CrShader::Docs"
overview: |
  CRShader ships a dedicated `CrShader::CrShaderSyntaxHighlighter < Godot::EditorSyntaxHighlighter` alongside
  full-palette `Godot::CodeHighlighter` configurations for both `.crshader` source files and transpiled
  `.gdshader`, `.gdshaderinc`, and `.glsl` targets. Every symbol, named argument, punctuation mark, range,
  and member access receives an explicit high-contrast color so zero tokens ever fall back to black.
related_sources:
  - "src/highlighter.cr"
  - "src/crshader/addon.cr"
sections:
  - id: topic_01_highlighter_architecture
    title: "EditorSyntaxHighlighter & Character-Column Tokenizer"
    summary: "Extending Godot::EditorSyntaxHighlighter via Lapis C-API span dispatch."
    content: |
      In the Godot Editor, `CrShader::Highlighter.apply_to_code_edit` attaches `CrShaderSyntaxHighlighter`,
      which overrides `_get_line_syntax_highlighting` and streams UTF-32 character-column spans through
      `Godot::Bridge.highlighter_add_span`. In standalone runtime viewers where `EditorSyntaxHighlighter`
      is unavailable, it automatically falls back to `Highlighter.create_code_highlighter` with explicit
      `symbol_color`, `member_variable_color`, `function_color`, and `number_color` settings.
    examples:
      - |
        ```crystal
        CrShader::Highlighter.apply_to_code_edit(source_code_edit)
        CrShader::Highlighter.apply_target_to_code_edit(preview_code_edit)
        ```

  - id: topic_02_token_categories
    title: "Highlighted Token Categories"
    summary: "Semantic colors across Crystal symbols, named arguments, directives, and GLSL intrinsics."
    content: |
      `CrShader::Highlighter.highlight_crshader_line` distinguishes all Crystal and shader constructs:

      - **DSL Directives**: `emit_target`, `shader_type`, `render_mode`, `feature`, `when_feature`, `unless_feature`, `uniform`, `varying`, `flat_varying`, `buffer`, `push_constant`, `require`, `gd_include`.
      - **Crystal Symbols & Named Arguments**: Full `:spatial`, `:ambient_light_disabled`, and `:source_color` symbols in bright cyan, and `default:` / `range:` named-argument keys in sky blue.
      - **Preprocessor vs Comments**: `#include`, `#define`, `#ifndef`, and `#[compute]` in coral orange, distinct from `#` comments.
      - **Types, Built-ins & Intrinsics**: `Float32`, `Vec3`, `Color`, `Sampler2D`, `ALBEDO`, `NORMAL`, `DEPTH`, `ROUGHNESS`, `gl_GlobalInvocationID`, and GLSL math/texture functions.
      - **Punctuation & Ranges**: `,`, `:`, `..`, `(`, `)`, `=`, and `?` in cool silver with proper `0..253` range splitting.
