id: C_CLI_AND_STUBS
title: "CRShader CLI Tool & IDE Stubs"
summary: "Standalone CLI compiler commands, directory watcher, and Crystal IDE completion stub generation."
track: "03_editor_tooling"
root_module: "CrShader::Docs"
overview: |
  The standalone `crshader` CLI tool provides command-line building, continuous directory watching,
  and rich Crystal IDE autocompletion stubs for VSCode, Neovim, and Sublime Text.
related_sources:
  - "bin/crshader/src/cli.cr"
  - "bin/crshader/src/crshader/stubs/stub_generator.cr"
sections:
  - id: topic_01_cli_commands
    title: "Command-Line Interface Commands"
    summary: "Complete reference for crshader build, watch, stubs, and install-addon."
    content: |
      The `crshader` CLI binary supports several core subcommands:
    options:
      "crshader build <file> -t <target>": "Compile a .crshader file to .gdshader or .glsl"
      "crshader watch <dir>": "Watch directory for changes and continuously transpile"
      "crshader stubs -o <path>": "Generate Crystal completion stubs (default: src/libgodot/crshader.cr)"
      "crshader install-addon <godot_dir>": "Copy GDExtension plugin files into a Godot project"
      "-v, --version": "Print version string"
      "-h, --help": "Display CLI help information"
    examples:
      - |
        ```bash
        # Compile a single shader
        bin/crshader build shaders/water.crshader -t gdshader -o shaders/water.gdshader

        # Watch shaders folder continuously
        bin/crshader watch shaders/

        # Generate IDE autocompletion stubs
        bin/crshader stubs -o src/libgodot/crshader.cr
        ```

  - id: topic_02_ide_stubs
    title: "IDE Autocomplete Stubs (stub_generator)"
    summary: "Generating typed Crystal definitions for Godot built-in shader functions and types."
    content: |
      Because `.crshader` is valid Crystal syntax, you can use standard Crystal Language Server (LSP)
      tooling (such as `crystalline` or `scry`) to get full autocompletion, type signatures, and
      hover documentation.

      Running `crshader stubs` generates a typed stub file containing every Godot built-in function
      (`smoothstep`, `mix`, `texture`, `sin`, `cos`, `cross`, `dot`, `inverse`, etc.) with mirrored
      Godot 4 documentation comments.
    examples:
      - |
        ```bash
        crshader stubs -o src/libgodot/crshader.cr
        ```
