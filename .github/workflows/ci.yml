name: Addon CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crshader-addon-ci:
    name: CRShader Addon CI
    uses: sol-vin/lapis/.github/workflows/build-addon.yml@4.8-dev7
    with:
      addon-name: crshader
      entry-point: src/main.cr
      crystal-version: "1.21.0"
      godot-version: "4.8-dev7"
      lapis-ref: "4.8-dev7"
      os-matrix: '["ubuntu-latest", "windows-latest"]'
      run-specs: true
      run-headless: true
      run-benchmarks: true
      install-libvlc: "false"
