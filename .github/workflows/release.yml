name: Addon Release
run-name: Build & Release CrShader Addon (${{ github.ref_name }})

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Addon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset_name: crshader-windows.zip
          - os: ubuntu-latest
            platform: linux
            asset_name: crshader-linux.zip

    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Linux Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld make

      - name: Verify Toolchain
        run: |
          crystal -v

      - name: Install Shards Dependencies
        run: |
          shards install || true

      - name: Setup Godot Engine (4.8-dev4)
        uses: appsinacup/action_setup_godot@main
        with:
          repo: godotengine/godot-builds
          version: 4.8-dev4
          enable_cache: true

      - name: Build & Package Addon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidate = $env:GODOT4
          if ($candidate) { $candidate = $candidate -replace '^/([a-zA-Z])/', '$1:/' }
          if ($candidate -and (Test-Path $candidate)) {
            Copy-Item $candidate ./godot.exe -Force
          }
          # Compile and package release zip (contains strictly addons/crshader/ without source)
          make package RELEASE=1

      - name: Build & Package Addon (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -n "$GODOT4" ] && [ -f "$GODOT4" ]; then
            cp "$GODOT4" ./godot
            chmod +x ./godot
          fi
          # Compile and package release zip (contains strictly addons/crshader/ without source)
          make package RELEASE=1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
